
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: ha-etcd
    command:
      - /usr/local/bin/etcd
      - --name=etcd1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd1=http://etcd:2380
      - --initial-cluster-state=new
    volumes:
      - etcd_data:/etcd-data
    networks:
      - ha-network
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/etcdctl
        - endpoint
        - health
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  node1:
    image: ghcr.io/zalando/spilo-17:4.0-p3
    container_name: ha-node1
    hostname: node1
    environment:
      SCOPE: postgres-ha
      PGVERSION: "17"
      PGUSER_SUPERUSER: postgres
      PGPASSWORD_SUPERUSER: "${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD in .env}"
      PGUSER_STANDBY: standby
      PGPASSWORD_STANDBY: "${POSTGRES_STANDBY_PASSWORD:?Set POSTGRES_STANDBY_PASSWORD in .env}"
      ETCD3_HOST: etcd:2379
    ports:
      - "5432:5432"
      - "8008:8008"
    volumes:
      - node1_data:/home/postgres/pgdata
    networks:
      ha-network:
        ipv4_address: 172.18.0.10
    depends_on:
      etcd:
        condition: service_healthy
    restart: unless-stopped

  node2:
    image: ghcr.io/zalando/spilo-17:4.0-p3
    container_name: ha-node2
    hostname: node2
    environment:
      SCOPE: postgres-ha
      PGVERSION: "17"
      PGUSER_SUPERUSER: postgres
      PGPASSWORD_SUPERUSER: "${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD in .env}"
      PGUSER_STANDBY: standby
      PGPASSWORD_STANDBY: "${POSTGRES_STANDBY_PASSWORD:?Set POSTGRES_STANDBY_PASSWORD in .env}"
      ETCD3_HOST: etcd:2379
    ports:
      - "5433:5432"
      - "8009:8008"
    volumes:
      - node2_data:/home/postgres/pgdata
    networks:
      ha-network:
        ipv4_address: 172.18.0.11
    depends_on:
      etcd:
        condition: service_healthy
    restart: unless-stopped

  node3:
    image: ghcr.io/zalando/spilo-17:4.0-p3
    container_name: ha-node3
    hostname: node3
    environment:
      SCOPE: postgres-ha
      PGVERSION: "17"
      PGUSER_SUPERUSER: postgres
      PGPASSWORD_SUPERUSER: "${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD in .env}"
      PGUSER_STANDBY: standby
      PGPASSWORD_STANDBY: "${POSTGRES_STANDBY_PASSWORD:?Set POSTGRES_STANDBY_PASSWORD in .env}"
      ETCD3_HOST: etcd:2379
    ports:
      - "5434:5432"
      - "8010:8008"
    volumes:
      - node3_data:/home/postgres/pgdata
    networks:
      ha-network:
        ipv4_address: 172.18.0.12
    depends_on:
      etcd:
        condition: service_healthy
    restart: unless-stopped

  haproxy:
    image: haproxy:3.2
    container_name: ha-haproxy
    ports:
      - "5000:5000"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - ha-network
    depends_on:
      - node1
      - node2
      - node3
    restart: unless-stopped

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: ha-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - ha-network
    restart: unless-stopped

  backup:
    build:
      context: .
      dockerfile: backup/Dockerfile
    container_name: ha-backup
    entrypoint: ["/bin/bash", "-c"]
    command: ["exec sleep infinity"]
    environment:
      PGPASSWORD: "${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD in .env}"
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}"
      BACKUP_BUCKET: postgres-backups
    networks:
      - ha-network
    depends_on:
      - minio
      - haproxy
    restart: unless-stopped

networks:
  ha-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1

volumes:
  etcd_data:
  node1_data:
  node2_data:
  node3_data:
  minio_data:
